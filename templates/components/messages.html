{% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="message{% if message.tags %} message-{{ message.tags }}{% endif %}" role="alert">
                <span>{{ message }}</span>
                <button type="button" class="message-close" aria-label="Cerrar">&times;</button>
            </div>
        {% endfor %}
    </div>
{% endif %}
